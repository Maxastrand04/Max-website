# Only Traefik may reach the site. Kubelet probes come from the node itself,
# which Cilium allows by default, so they need no rule here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: max-website
  labels:
    app.kubernetes.io/name: max-website
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: max-website
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
